name: Build

on:
  schedule:
    # Publish a nightly build every night from dev when user-facing files changed
    # since the previous nightly tag.
    - cron: "17 2 * * *"
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip release creation"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      is_nightly: ${{ steps.check.outputs.is_nightly }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          fetch-depth: 0

      - name: Check build conditions
        id: check
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "is_nightly=false" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "is_nightly=true" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "is_nightly=true" >> "$GITHUB_OUTPUT"
            echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            LAST_TAG=$(git tag --list "nightly-*" --sort=-version:refname | head -1)
            if [ -z "$LAST_TAG" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              USER_FACING_PATHS=$(git diff --name-only "$LAST_TAG"..HEAD -- \
                Cargo.toml \
                Cargo.lock \
                rust/ \
                installer/ | sed '/^$/d')
              if [ -n "$USER_FACING_PATHS" ]; then
                echo "should_build=true" >> "$GITHUB_OUTPUT"
              else
                echo "should_build=false" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  build-windows:
    name: Windows
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install GStreamer
        run: ./scripts/install-gstreamer-windows.ps1 -InstallDir "$env:RUNNER_TEMP\gstreamer"

      - name: Build
        run: |
          cargo build --release --features gui
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item target/release/station-scout.exe dist/windows/StationScout.exe
          "[version]`nvalue=${{ needs.prepare.outputs.version }}" | Set-Content dist/version.txt
          Compress-Archive -Path dist/windows/* -DestinationPath "dist/StationScout_Portable_${{ needs.prepare.outputs.version }}.zip" -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/station-scout.iss

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/StationScout_Setup_*.exe
            dist/StationScout_Portable_*.zip

  build-linux:
    name: Linux
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-linux-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libssl-dev \
            pkg-config \
            xvfb

      - name: Build
        run: |
          cargo build --release --features gui
          mkdir -p dist/StationScout
          cp target/release/station-scout dist/StationScout/StationScout

      - name: Smoke test built binary
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/station-scout-config
          XDG_DATA_HOME: ${{ runner.temp }}/station-scout-data
          XDG_CACHE_HOME: ${{ runner.temp }}/station-scout-cache
        run: |
          set +e
          timeout 25s xvfb-run -a dist/StationScout/StationScout > linux-smoke.log 2>&1
          status=$?
          set -e
          cat linux-smoke.log
          if grep -E "cannot register existing type|GLib-GObject-CRITICAL" linux-smoke.log; then
            echo "Built Linux binary hit the GLib/GIO duplicate type-registration crash."
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Built Linux binary exited unexpectedly with status $status."
            exit "$status"
          fi

      - name: Package AppImage
        timeout-minutes: 15
        run: python3 installer/build_appimage.py

      - name: Smoke test AppImage on Fedora
        timeout-minutes: 15
        run: |
          cat > fedora-smoke.sh <<'EOF'
          set -e
          dnf install -y -q gtk3 libnotify alsa-lib gstreamer1 gstreamer1-plugins-base \
            xorg-x11-server-Xvfb dejavu-sans-fonts >/dev/null
          cd /work
          appimage=$(find dist -maxdepth 1 -name 'StationScout_Linux_*.AppImage' -print -quit)
          if [ -z "$appimage" ]; then
            echo "AppImage was not created."
            exit 1
          fi
          chmod +x "$appimage"
          export XDG_CONFIG_HOME=/tmp/ss-config XDG_DATA_HOME=/tmp/ss-data XDG_CACHE_HOME=/tmp/ss-cache
          set +e
          timeout 25s xvfb-run -a "$appimage" --appimage-extract-and-run > fedora-smoke.log 2>&1
          status=$?
          set -e
          cat fedora-smoke.log
          if grep -E "error while loading shared libraries|cannot open shared object file" fedora-smoke.log; then
            echo "AppImage is missing a shared library on Fedora."
            exit 1
          fi
          if grep -E "cannot register existing type|GLib-GObject-CRITICAL" fedora-smoke.log; then
            echo "AppImage hit the GLib/GIO duplicate type-registration crash on Fedora."
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "AppImage exited unexpectedly with status $status on Fedora."
            exit "$status"
          fi
          echo "Fedora smoke test passed."
          EOF
          docker run --rm -v "$PWD:/work" fedora:43 bash /work/fedora-smoke.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/StationScout_Linux_*.AppImage

  release:
    name: Release
    needs: [prepare, build-windows, build-linux]
    if: always() && needs.prepare.outputs.should_build == 'true' && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          fetch-depth: 0

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Prepare release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p assets
          TIMESTAMP=$(date -u +%Y%m%d)

          while IFS= read -r f; do
            name=$(basename "$f")
            if [ "$IS_NIGHTLY" = "true" ]; then
              case "$name" in
                *Setup*.exe) mv "$f" "assets/StationScout-nightly-${TIMESTAMP}-windows-setup.exe" ;;
                *Portable*.zip) mv "$f" "assets/StationScout-nightly-${TIMESTAMP}-windows-portable.zip" ;;
                *Linux*.AppImage) mv "$f" "assets/StationScout-nightly-${TIMESTAMP}-linux-x86_64.AppImage" ;;
              esac
            else
              case "$name" in
                *Setup*.exe) mv "$f" "assets/StationScout-${VERSION}-windows-setup.exe" ;;
                *Portable*.zip) mv "$f" "assets/StationScout-${VERSION}-windows-portable.zip" ;;
                *Linux*.AppImage) mv "$f" "assets/StationScout-${VERSION}-linux-x86_64.AppImage" ;;
              esac
            fi
          done < <(find dist -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.AppImage' \))

          cd assets && sha256sum * > checksums.txt 2>/dev/null || true
          cd ..

          if [ "$IS_NIGHTLY" = "true" ]; then
            LAST_TAG=$(git tag --list "nightly-*" --sort=-version:refname | head -1)
            if [ -n "$LAST_TAG" ]; then
              gh release view "$LAST_TAG" --json body -q .body > previous-notes.md || true
              python scripts/changelog_tools.py notes \
                --kind nightly \
                --previous-tag "$LAST_TAG" \
                --exclude-notes previous-notes.md \
                --output notes.md
            else
              python scripts/changelog_tools.py notes --kind nightly --output notes.md
            fi
          else
            python scripts/changelog_tools.py notes \
              --kind stable \
              --version "$TAG" \
              --output notes.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: assets/*

      - name: Create release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "$IS_NIGHTLY" = "true" ]; then
            gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" assets/* --notes-file notes.md \
              --title "Nightly $(date -u +%Y-%m-%d)" --prerelease --target dev
          elif gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md --title "Station Scout v${VERSION}"
          else
            gh release create "$TAG" assets/* --notes-file notes.md \
              --title "Station Scout v${VERSION}"
          fi
