name: CI

# Docs-only changes (Markdown, docs/, LICENSE) skip CI. CHANGELOG.md is
# Markdown too, but the CHANGELOG gate only matters when code changes.
on:
  push:
    branches: [main, dev]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE*"]
  pull_request:
    branches: [main, dev]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE*"]
  workflow_dispatch:

# One run per branch or PR. A new push to a PR cancels the older run;
# pushes to dev and main always finish so their caches get saved.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info in CI builds: faster compiles and links, much smaller caches.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Fast checks that need no Rust build. They finish in seconds, so a
  # formatting slip or a missing CHANGELOG entry shows up right away.
  lint:
    name: Format and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Format
        run: cargo fmt --check

      - name: Check CHANGELOG entry
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            echo "PR detected - checking changelog entries against $BASE"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
            git fetch --no-tags origin "$BASE" || true
            echo "Push detected - checking changelog entries against $BASE"
          else
            BASE="HEAD~1"
            echo "Manual run detected - checking changelog entries against $BASE"
          fi

          if ! python scripts/changelog_tools.py check --base "$BASE" --head HEAD; then
            {
              echo "### CHANGELOG gate"
              echo
              echo "User-facing changes need a curated \`CHANGELOG.md\` entry under \`## [Unreleased]\`."
              echo "This keeps nightly and stable release notes based on product wording instead of PR titles."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # Caches dependencies only (not our own crate), keyed on the toolchain
      # and Cargo.lock. PRs reuse the dev/main cache but don't write their
      # own, so they don't push the good caches out of the 10 GB limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Test
        run: cargo test --locked

  windows:
    name: Test and bundle check (Windows)
    runs-on: windows-latest
    # A cold run (GStreamer download plus an empty Rust cache) can take close
    # to an hour; cached runs take a few minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Restore and save GStreamer as separate steps so a successful install
      # is cached right away, even if a later step fails or the job times out.
      # The freedesktop.org mirror can take over 30 minutes from CI.
      - name: Restore GStreamer cache
        id: gst-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/gstreamer
          key: gstreamer-msvc-x86_64-1.28.3

      - name: Install GStreamer
        shell: pwsh
        run: ./scripts/install-gstreamer-windows.ps1 -InstallDir "$env:RUNNER_TEMP\gstreamer"

      - name: Save GStreamer cache
        if: steps.gst-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/gstreamer
          key: gstreamer-msvc-x86_64-1.28.3

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Test
        run: cargo test --locked

      - name: Check wxDragon desktop build with GStreamer playback
        run: cargo check --locked --bin station-scout --features gui

      - name: Check bundled GStreamer runs without a system install
        shell: pwsh
        run: |
          # cargo test already built this binary, so this is a quick no-op build.
          cargo build --locked --bin station-scout
          $dest = Join-Path $env:RUNNER_TEMP "bundle-check"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item target/debug/station-scout.exe (Join-Path $dest "StationScout.exe")
          ./scripts/bundle-gstreamer-windows.ps1 -GstRoot "$env:RUNNER_TEMP\gstreamer" -Dest $dest
          # Run without the build machine's GStreamer on PATH, like a user's PC.
          $gstBin = Join-Path $env:RUNNER_TEMP "gstreamer\bin"
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and ($_.TrimEnd('\') -ne $gstBin.TrimEnd('\')) }) -join ';'
          Remove-Item Env:GSTREAMER_1_0_ROOT_MSVC_X86_64, Env:GSTREAMER_ROOT_X86_64, Env:PKG_CONFIG_PATH -ErrorAction SilentlyContinue
          $env:GST_REGISTRY = Join-Path $env:RUNNER_TEMP "ci-registry.bin"
          & (Join-Path $dest "StationScout.exe") --check-gstreamer
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled GStreamer check failed with exit code $LASTEXITCODE (0xC0000135 = missing DLL)."
          }
