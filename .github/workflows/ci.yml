name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows can need extra time on a cold GStreamer cache (slow mirror).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install GStreamer (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Cache GStreamer (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/gstreamer
          key: gstreamer-msvc-x86_64-1.28.3

      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-gstreamer-windows.ps1 -InstallDir "$env:RUNNER_TEMP\gstreamer"

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Check CHANGELOG entry
        if: runner.os == 'Linux'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:${BASE}" || true
            echo "PR detected - checking changelog entries against $BASE"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
            git fetch --no-tags origin "$BASE" || true
            echo "Push detected - checking changelog entries against $BASE"
          else
            BASE="HEAD~1"
            echo "Manual run detected - checking changelog entries against $BASE"
          fi

          if ! python scripts/changelog_tools.py check --base "$BASE" --head HEAD; then
            {
              echo "### CHANGELOG gate"
              echo
              echo "User-facing changes need a curated \`CHANGELOG.md\` entry under \`## [Unreleased]\`."
              echo "This keeps nightly and stable release notes based on product wording instead of PR titles."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Test
        run: cargo test

      - name: Check wxDragon desktop build with GStreamer playback
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo check --bin station-scout --features gui

      - name: Check bundled GStreamer runs without a system install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --bin station-scout
          $dest = Join-Path $env:RUNNER_TEMP "bundle-check"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item target/debug/station-scout.exe (Join-Path $dest "StationScout.exe")
          python scripts/bundle_gstreamer_windows.py --gst-root "$env:RUNNER_TEMP\gstreamer" --dest $dest
          # Run without the build machine's GStreamer on PATH, like a user's PC.
          $gstBin = Join-Path $env:RUNNER_TEMP "gstreamer\bin"
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and ($_.TrimEnd('\') -ne $gstBin.TrimEnd('\')) }) -join ';'
          Remove-Item Env:GSTREAMER_1_0_ROOT_MSVC_X86_64, Env:GSTREAMER_ROOT_X86_64, Env:PKG_CONFIG_PATH -ErrorAction SilentlyContinue
          $env:GST_REGISTRY = Join-Path $env:RUNNER_TEMP "ci-registry.bin"
          & (Join-Path $dest "StationScout.exe") --check-gstreamer
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled GStreamer check failed with exit code $LASTEXITCODE (0xC0000135 = missing DLL)."
          }
