[package]
name = "station-scout"
version = "1.0.0"
edition = "2024"
description = "Accessible desktop internet radio and podcast explorer."
license = "MIT"

[lib]
name = "station_scout"
path = "rust/src/lib.rs"

[[bin]]
name = "station-scout"
path = "rust/src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
md5 = "0.8"
percent-encoding = "2.3"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
url = "2.5"
gstreamer = "0.24"
wxdragon = { version = "0.9.16", optional = true }
keyring = "4.0.1"
keyring-core = "1.0.0"

[features]
default = []
gui = ["dep:wxdragon"]

[dev-dependencies]
tempfile = "3.23"
